openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /tractatus/generate:
    post:
      operationId: generateTractatus
      tags: [tractatus]
      summary: Stream a tree, variation, or prose conversion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerationInput"
      responses:
        "200":
          description: SSE JSON events containing content, status, done, or error
          content:
            text/event-stream:
              schema:
                type: string
  /tractatus/detect:
    post:
      operationId: detectText
      tags: [tractatus]
      summary: Analyze text using GPTZero
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetectionInput"
      responses:
        "200":
          description: Real GPTZero analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionResult"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    GenerationInput:
      type: object
      required: [stage, text]
      properties:
        stage:
          type: string
          enum: [tree, variation, prose]
        text:
          type: string
          minLength: 1
          maxLength: 1000000
    DetectionInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1000000
    DetectionResult:
      type: object
      required: [aiProbability, classification, message, analyzedCharacters, totalCharacters]
      properties:
        aiProbability:
          type: number
        classification:
          type: string
        message:
          type: string
        analyzedCharacters:
          type: integer
        totalCharacters:
          type: integer
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

